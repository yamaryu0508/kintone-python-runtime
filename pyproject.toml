[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kintone-python-runtime"
version = "0.2.0"
description = "Declarative async runtime for kintone operations (httpx, Pydantic, HTTP/2)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ryu Yamashita", email = "yamaryu0508@yahoo.co.jp" }]
keywords = ["kintone", "cybozu", "async", "httpx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx[http2]>=0.27,<1",
  "pydantic>=2.0,<3",
  "aiolimiter>=1.1,<2",
  "anyio>=4.0,<5",
]

[project.urls]
Homepage = "https://github.com/yamaryu0508/kintone-python-runtime"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "pyright>=1.1",
]
redis = [
  "redis>=5,<6",
  "arq>=0.26,<0.27",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kintone_python_runtime = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
